<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Battle Simulator - Architecture & Dependency Explorer</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.5); }
    .badge-ui { background-color: #3b82f6; color: white; }
    .badge-service { background-color: #8b5cf6; color: white; }
    .badge-ai { background-color: #ec4899; color: white; }
    .badge-entity { background-color: #10b981; color: white; }
    .badge-util { background-color: #f59e0b; color: white; }
    .badge-function { background-color: #06b6d4; color: white; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans antialiased">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-3xl">🎮</span>
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            Pokemon Battle Simulator
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Architecture Map</span>
          </h1>
        </div>
        <p class="text-sm text-slate-400 mt-1">전체 코드베이스 계층 구조 및 모듈 간 호출/참조 상관관계 인터랙티브 탐색기</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400">총 38개 핵심 모듈 매핑됨</span>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex flex-wrap gap-2 border-b border-slate-800 pb-2" id="navTabs">
      <button onclick="switchView('explorer')" id="tabExplorer" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
        🧭 모듈별 상관관계 탐색기
      </button>
      <button onclick="switchView('scenarios')" id="tabScenarios" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700">
        ⚡ 4대 핵심 런타임 시나리오 흐름
      </button>
      <button onclick="switchView('matrix')" id="tabMatrix" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700">
        📋 전체 의존성 매트릭스 표
      </button>
    </nav>

    <!-- VIEW 1: EXPLORER -->
    <div id="viewExplorer" class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Left Column: Filter & Module Grid (7 cols) -->
      <div class="lg:col-span-7 space-y-4">
        <!-- Control Bar -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
          <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">🔍</span>
            <input type="text" id="searchInput" placeholder="모듈명 또는 함수 검색 (예: battleStart, damage...)" 
              class="w-full pl-9 pr-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
              oninput="handleSearch()">
          </div>
          <div class="flex flex-wrap gap-1.5" id="layerFilterButtons">
            <!-- Filter buttons injected dynamically -->
          </div>
        </div>

        <!-- Modules Grid -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 max-h-[640px] overflow-y-auto">
          <div id="modulesContainer" class="space-y-6">
            <!-- Layers & cards injected dynamically -->
          </div>
        </div>
      </div>

      <!-- Right Column: Selected Module Details & Relationships (5 cols) -->
      <div class="lg:col-span-5 space-y-4">
        <div id="detailPanel" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sticky top-6 shadow-xl space-y-5">
          <div class="text-center py-16 text-slate-500">
            <div class="text-4xl mb-3">👈</div>
            <p class="font-medium text-slate-400">좌측에서 확인하고 싶은 모듈을 클릭하세요.</p>
            <p class="text-xs mt-1 text-slate-500">누가 이 모듈을 호출하고, 이 모듈이 무엇을 호출하는지 시각적으로 보여줍니다.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- VIEW 2: SCENARIOS -->
    <div id="viewScenarios" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <button onclick="showScenario('turn')" id="scBtnTurn" class="scenario-btn p-4 rounded-xl border border-indigo-500 bg-indigo-500/10 text-left transition-all">
          <div class="text-xs font-semibold text-indigo-400">시나리오 1</div>
          <div class="font-bold text-white mt-1">⚔️ 배틀 1턴 실행 흐름</div>
          <div class="text-xs text-slate-400 mt-1">유저 클릭부터 스냅샷 큐까지</div>
        </button>
        <button onclick="showScenario('ai')" id="scBtnAi" class="scenario-btn p-4 rounded-xl border border-slate-700 bg-slate-800 text-left hover:border-slate-600 transition-all">
          <div class="text-xs font-semibold text-pink-400">시나리오 2</div>
          <div class="font-bold text-white mt-1">🧠 AI 5단계 킬각 판단</div>
          <div class="text-xs text-slate-400 mt-1">우선도 ➡️ 디메리트 ➡️ 명중 ➡️ 딜</div>
        </button>
        <button onclick="showScenario('custom')" id="scBtnCustom" class="scenario-btn p-4 rounded-xl border border-slate-700 bg-slate-800 text-left hover:border-slate-600 transition-all">
          <div class="text-xs font-semibold text-emerald-400">시나리오 3</div>
          <div class="font-bold text-white mt-1">🛠️ 커스텀 엔트리 & 배틀 진입</div>
          <div class="text-xs text-slate-400 mt-1">CustomScreen ➡️ Battle 인스턴스</div>
        </button>
        <button onclick="showScenario('mega')" id="scBtnMega" class="scenario-btn p-4 rounded-xl border border-slate-700 bg-slate-800 text-left hover:border-slate-600 transition-all">
          <div class="text-xs font-semibold text-amber-400">시나리오 4</div>
          <div class="font-bold text-white mt-1">💥 메가진화 실행 파이프라인</div>
          <div class="text-xs text-slate-400 mt-1">도구반응 ➡️ 스탯 ➡️ 특성발동</div>
        </button>
      </div>

      <div id="scenarioContent" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <!-- Scenario content injected dynamically -->
      </div>
    </div>

    <!-- VIEW 3: MATRIX -->
    <div id="viewMatrix" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl overflow-x-auto">
      <h3 class="text-lg font-bold text-white mb-4">전체 모듈 의존성 및 책임 매트릭스</h3>
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="border-b border-slate-700 text-slate-400 font-semibold">
            <th class="py-3 px-3">레이어</th>
            <th class="py-3 px-3">모듈명</th>
            <th class="py-3 px-3">경로</th>
            <th class="py-3 px-3">상위 호출자 (Callers)</th>
            <th class="py-3 px-3">하위 의존 모듈 (Dependencies)</th>
            <th class="py-3 px-4">핵심 책임 및 역할</th>
          </tr>
        </thead>
        <tbody id="matrixTableBody" class="divide-y divide-slate-700/60 text-slate-300">
          <!-- Injected dynamically -->
        </tbody>
      </table>
    </div>

  </div>

    // --- MODULES DATA GRAPH ---

      { id: "FilterModal", name: "FilterModal.js", layer: "UI", path: "src/component/customScreen/FilterModal.js", callers: ["CustomScreen"], callees: ["customEntryUtil"], desc: "타입(OR/AND 로직 스위치), 역할군, 메가, 초전설, 위협, 날씨, 벽깔이 필터 모달", funcs: ["FilterModal()"] },

      { id: "StatAdjustmentModal", name: "StatAdjustmentModal.js", layer: "UI", path: "src/component/customScreen/sampleInfo/StatAdjustmentModal.js", callers: ["SampleInfoModal"], callees: ["PokemonTemplate"], desc: "개체값(6V, 5V0A), 노력치(252/252/4), 성격 보정 설정 및 6각형 레이더 차트", funcs: ["calculateStat()", "getNatureInfo()"] },

      // Service Layer

      { id: "calculateSkillScore", name: "calculateSkillScore.js", layer: "AI", path: "src/npc/ai/calculateSkillScore.js", callers: ["easy"], callees: ["damageCalculate", "accuracyCalculate", "easy"], desc: "공격/변화기 가중치 점수 산출, getLowHpFactor 희생기 지수 곡선, 장판/벽 점수", funcs: ["calculateSkillScore()", "getLowHpFactor()", "rankScoreCalculate()"] },

    let activeLayerFilter = "ALL";

    function init() {
      renderLayerFilterButtons();
      renderModules();
      renderMatrix();
      showScenario('turn');
    }

    function renderLayerFilterButtons() {
      const container = document.getElementById("layerFilterButtons");
      let html = `<button onclick="filterLayer('ALL')" class="layer-btn px-2.5 py-1 rounded-md text-xs font-medium transition-all ${activeLayerFilter === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}">전체</button>`;
      Object.entries(LAYERS).forEach(([key, info]) => {
        const isActive = activeLayerFilter === key;
        html += `<button onclick="filterLayer('${key}')" class="layer-btn px-2.5 py-1 rounded-md text-xs font-medium transition-all ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}">${key}</button>`;
      });
      container.innerHTML = html;
    }

    function filterLayer(layerKey) {
      activeLayerFilter = layerKey;
      renderLayerFilterButtons();
      renderModules();
    }

    function handleSearch() {
      renderModules();
    }

    function renderModules() {
      const container = document.getElementById("modulesContainer");
      const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();

      // Group modules by layer
      const grouped = {};
      Object.keys(LAYERS).forEach(k => grouped[k] = []);

      MODULES.forEach(mod => {
        if (activeLayerFilter !== "ALL" && mod.layer !== activeLayerFilter) return;
        if (query) {
          const matchName = mod.name.toLowerCase().includes(query);
          const matchDesc = mod.desc.toLowerCase().includes(query);
          const matchFuncs = mod.funcs.some(f => f.toLowerCase().includes(query));
          if (!matchName && !matchDesc && !matchFuncs) return;
        }
        if (grouped[mod.layer]) grouped[mod.layer].push(mod);
      });

      let html = "";
      Object.entries(grouped).forEach(([layerKey, list]) => {
        if (list.length === 0) return;
        const layerInfo = LAYERS[layerKey];
        html += `
          <div>
            <div class="flex items-center gap-2 mb-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${layerInfo.color}"></span>
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">${layerInfo.name} (${layerKey})</h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${list.map(mod => {
                const isSelected = selectedModuleId === mod.id;
                return `
                  <div onclick="selectModule('${mod.id}')"
                    class="cursor-pointer p-3 rounded-xl border transition-all ${
                      isSelected 
                        ? 'border-indigo-400 bg-indigo-500/20 shadow-md ring-2 ring-indigo-500/30' 
                        : 'border-slate-700/80 bg-slate-800/90 hover:border-slate-500 hover:bg-slate-800'
                    }">
                    <div class="flex items-center justify-between gap-2">
                      <div class="font-semibold text-sm text-white flex items-center gap-1.5">
                        <span class="text-xs">${isSelected ? '📌' : '📄'}</span>
                        ${mod.name}
                      </div>
                      <span class="text-[10px] px-1.5 py-0.5 rounded font-mono ${layerInfo.color}">${mod.layer}</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-1 line-clamp-2 leading-relaxed">${mod.desc}</p>
                    <div class="flex items-center gap-3 text-[10px] text-slate-500 mt-2 font-mono">
                      <span>In: <strong class="text-slate-300">${mod.callers.length}</strong></span>
                      <span>Out: <strong class="text-slate-300">${mod.callees.length}</strong></span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      });

      if (!html) {
        html = `<div class="text-center py-12 text-slate-500 text-sm">일치하는 모듈이 없습니다.</div>`;
      }

      container.innerHTML = html;
    }

    function selectModule(id) {
      selectedModuleId = id;
      renderModules();

      const mod = MODULES.find(m => m.id === id);
      if (!mod) return;

      const layerInfo = LAYERS[mod.layer];
      const callersList = mod.callers.map(cid => {
        const target = MODULES.find(m => m.id === cid || m.name === cid);
        return target ? { id: target.id, name: target.name, layer: target.layer } : { id: cid, name: cid, layer: "External" };
      });
      const calleesList = mod.callees.map(cid => {
        const target = MODULES.find(m => m.id === cid || m.name === cid);
        return target ? { id: target.id, name: target.name, layer: target.layer } : { id: cid, name: cid, layer: "External" };
      });

      const panel = document.getElementById("detailPanel");
      panel.innerHTML = `
        <div class="flex items-start justify-between gap-3 border-b border-slate-700 pb-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs px-2 py-0.5 rounded font-mono font-bold ${layerInfo.color}">${mod.layer} Layer</span>
              <h3 class="text-xl font-bold text-white">${mod.name}</h3>
            </div>
            <p class="text-xs font-mono text-slate-400 mt-1">${mod.path}</p>
          </div>
        </div>

        </div>

          <div class="flex flex-wrap gap-1.5">
            ${mod.funcs.map(f => `<span class="text-xs font-mono px-2 py-1 bg-slate-900 text-indigo-300 rounded-md border border-slate-700">${f}</span>`).join("")}
          </div>
        </div>

        <!-- Inbound: Who calls this module -->
        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center justify-between">
            <span>📥 상위 호출자 (Callers) [${callersList.length}]</span>
            <span class="text-[10px] text-slate-500 font-normal">누가 이 모듈을 부르는가</span>
          </h4>
          <div class="space-y-1.5">
            ${callersList.length > 0 ? callersList.map(c => `
              <div onclick="selectModule('${c.id}')" class="cursor-pointer p-2 rounded-lg bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 flex items-center justify-between text-xs transition-colors">

                  <span class="text-slate-400">↳</span> ${c.name}
                </span>
                <span class="text-[10px] px-1.5 py-0.5 rounded font-mono ${LAYERS[c.layer]?.color || 'bg-slate-600 text-white'}">${c.layer}</span>
              </div>
            `).join("") : `<div class="text-xs text-slate-500 p-2 italic">상위 호출자가 없는 최상위 진입점이거나 루트 모듈입니다.</div>`}

        <div>

            <span>📤 하위 의존 모듈 (Dependencies) [${calleesList.length}]</span>

              <div onclick="selectModule('${c.id}')" class="cursor-pointer p-2 rounded-lg bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 flex items-center justify-between text-xs transition-colors">

                  <span class="text-slate-400">↳</span> ${c.name}

              </div>
            `).join("") : `<div class="text-xs text-slate-500 p-2 italic">하위 의존성 없는 순수 독립 모듈입니다.</div>`}
          </div>
        </div>

    function switchView(viewName) {
      document.getElementById("viewExplorer").classList.add("hidden");
      document.getElementById("viewScenarios").classList.add("hidden");
      document.getElementById("viewMatrix").classList.add("hidden");

      document.getElementById("tabExplorer").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700";
      document.getElementById("tabScenarios").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700";
      document.getElementById("tabMatrix").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700";

      if (viewName === "explorer") {
        document.getElementById("viewExplorer").classList.remove("hidden");
        document.getElementById("tabExplorer").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
      } else if (viewName === "scenarios") {
        document.getElementById("viewScenarios").classList.remove("hidden");
        document.getElementById("tabScenarios").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
      } else if (viewName === "matrix") {
        document.getElementById("viewMatrix").classList.remove("hidden");
        document.getElementById("tabMatrix").className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
      }
    }

          { step: 3, mod: "PokemonMega.js", action: "isMegaEvolveAble() 검증 후 megaEvolve() 실행: '도구가 반응했다!' 텍스트 큐 등록" },
          { step: 4, mod: "PokemonMega.js", action: "스탯(공/방/특공/특방/스피드) 메가 수치로 갱신, 타입 및 도감번호 변경, 스킨류 특성 노말타입 변환" },
          { step: 5, mod: "PokemonMega.js", action: "'메가진화했다!' 텍스트 큐 등록 후 applyAbilityEffects() 재호출 (가뭄/잔비 등 등장 특성 즉시 발동)" }
        ]
      }
    };

    function showScenario(key) {
      document.querySelectorAll('.scenario-btn').forEach(btn => {
        btn.classList.remove('border-indigo-500', 'bg-indigo-500/10');
        btn.classList.add('border-slate-700', 'bg-slate-800');
      });
      const activeBtn = document.getElementById('scBtn' + key.charAt(0).toUpperCase() + key.slice(1));
      if (activeBtn) {
        activeBtn.classList.add('border-indigo-500', 'bg-indigo-500/10');
        activeBtn.classList.remove('border-slate-700', 'bg-slate-800');
      }

      const sc = SCENARIOS[key];
      const container = document.getElementById("scenarioContent");
      container.innerHTML = `
        <div>
          <h3 class="text-xl font-bold text-white">${sc.title}</h3>
          <p class="text-sm text-slate-400 mt-1">${sc.desc}</p>
        </div>
        <div class="mt-6 space-y-3 relative before:absolute before:inset-0 before:left-5 before:w-0.5 before:bg-slate-700">
          ${sc.steps.map(s => `
            <div class="flex items-start gap-4 relative">
              <span class="w-10 h-10 rounded-full bg-slate-900 border-2 border-indigo-500 text-indigo-400 font-bold flex items-center justify-center text-sm z-10 shrink-0">
                ${s.step}
              </span>
              <div class="flex-1 bg-slate-900/80 p-4 rounded-xl border border-slate-700">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-mono font-bold text-indigo-300 px-2 py-0.5 bg-indigo-950/60 rounded border border-indigo-800/60">${s.mod}</span>
                </div>
                <p class="text-sm text-slate-200 leading-relaxed">${s.action}</p>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderMatrix() {
      const tbody = document.getElementById("matrixTableBody");
      tbody.innerHTML = MODULES.map(m => {
        const layerInfo = LAYERS[m.layer];
        return `
          <tr class="hover:bg-slate-700/30 transition-colors">
            <td class="py-2.5 px-3 whitespace-nowrap"><span class="px-2 py-0.5 rounded font-mono font-bold text-[10px] ${layerInfo.color}">${m.layer}</span></td>
            <td class="py-2.5 px-3 font-semibold text-white whitespace-nowrap">${m.name}</td>
            <td class="py-2.5 px-3 font-mono text-slate-400 text-[11px] whitespace-nowrap">${m.path}</td>
            <td class="py-2.5 px-3 text-slate-300">
              <div class="flex flex-wrap gap-1">
                ${m.callers.map(c => `<span class="px-1.5 py-0.5 rounded bg-slate-900 text-slate-300 text-[10px] border border-slate-700">${c}</span>`).join("")}
              </div>
            </td>
            <td class="py-2.5 px-3 text-slate-300">
              <div class="flex flex-wrap gap-1">
                ${m.callees.map(c => `<span class="px-1.5 py-0.5 rounded bg-slate-900 text-indigo-300 text-[10px] border border-slate-700">${c}</span>`).join("")}
              </div>
            </td>
            <td class="py-2.5 px-4 text-slate-300 leading-relaxed min-w-[240px]">${m.desc}</td>
          </tr>
        `;
      }).join("");
    }

    // Auto-init on load
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
